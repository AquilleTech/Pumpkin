name: Cross-Compile Pumpkin for Android

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: 'Android target triple'
        required: true
        default: 'aarch64-linux-android'
        type: choice
        options:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
          - i686-linux-android

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Minimum required Rust version from Pumpkin's rust-toolchain.toml
  RUST_EDITION: "2024"

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            arch: arm64-v8a
            clang_prefix: aarch64-linux-android28-clang
            # +neon is valid for aarch64
            extra_rustflags: "-C target-feature=+neon"
          - target: armv7-linux-androideabi
            arch: armeabi-v7a
            clang_prefix: armv7a-linux-androideabi28-clang
            extra_rustflags: "-C target-feature=+neon"
          - target: x86_64-linux-android
            arch: x86_64
            clang_prefix: x86_64-linux-android28-clang
            # No neon for x86
            extra_rustflags: ""
          - target: i686-linux-android
            arch: x86
            clang_prefix: i686-linux-android28-clang
            extra_rustflags: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Needed for build.rs git metadata extraction
          fetch-depth: 0

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26c
          add-to-path: true
          link-to-sdk: true

      # FIX: Correct action name is rust-toolchain, not rust-action
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # Cache key per-target to avoid cross-contamination between matrix jobs
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-registry-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target/${{ matrix.target }}
          key: ${{ runner.os }}-${{ matrix.target }}-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-build-

      - name: Install host dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pkg-config

      # FIX: Cargo config does NOT expand env vars in TOML values.
      # We must write the config AFTER we know the NDK path, using shell to expand it.
      - name: Generate .cargo/config.toml
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          TOOLCHAIN="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p .cargo
          cat > .cargo/config.toml << EOF
          [target.aarch64-linux-android]
          linker = "${TOOLCHAIN}/aarch64-linux-android28-clang"
          ar = "${TOOLCHAIN}/llvm-ar"

          [target.armv7-linux-androideabi]
          linker = "${TOOLCHAIN}/armv7a-linux-androideabi28-clang"
          ar = "${TOOLCHAIN}/llvm-ar"

          [target.x86_64-linux-android]
          linker = "${TOOLCHAIN}/x86_64-linux-android28-clang"
          ar = "${TOOLCHAIN}/llvm-ar"

          [target.i686-linux-android]
          linker = "${TOOLCHAIN}/i686-linux-android28-clang"
          ar = "${TOOLCHAIN}/llvm-ar"

          [build]
          rustflags = [
            "-C", "link-arg=-Wl,--no-rosegment",
            "-C", "link-arg=-Wl,--eh-frame-hdr",
            "-C", "link-arg=-Wl,-z,noexecstack",
            "-C", "link-arg=-Wl,-z,relro,-z,now",
          ]
          EOF
          echo "--- Generated .cargo/config.toml ---"
          cat .cargo/config.toml

      - name: Apply Android compatibility patches
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x scripts/patch-android.sh
          ./scripts/patch-android.sh

      - name: Build (Debug)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          # Cross-compiling: disable host pkg-config so it doesn't find wrong libs
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: ""
          # openssl-sys: point to NDK sysroot so it can find headers
          OPENSSL_DIR: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr
          OPENSSL_NO_VENDOR: "0"
        run: |
          cargo build --target ${{ matrix.target }} --verbose

      - name: Build (Release)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: ""
          OPENSSL_DIR: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr
          OPENSSL_NO_VENDOR: "0"
          # FIX: target-specific RUSTFLAGS from matrix — no neon on x86 targets
          RUSTFLAGS: "${{ matrix.extra_rustflags }} -C opt-level=3 -C lto=fat -C codegen-units=1 -C panic=abort"
        run: |
          cargo build --target ${{ matrix.target }} --release --verbose

      - name: Strip release binary
        run: |
          STRIP="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          BINARY="target/${{ matrix.target }}/release/pumpkin"
          if [ -f "${BINARY}" ]; then
            "${STRIP}" "${BINARY}"
            echo "Stripped: ${BINARY}"
          else
            echo "WARNING: Binary not found at ${BINARY}"
            # List what was actually produced for debugging
            find "target/${{ matrix.target }}/release" -maxdepth 1 \
              -type f ! -name "*.d" ! -name "*.rlib" ! -name "*.rmeta" | sort
          fi

      - name: Inspect binary
        run: |
          BINARY="target/${{ matrix.target }}/release/pumpkin"
          if [ -f "${BINARY}" ]; then
            echo "=== file ==="
            file "${BINARY}"
            echo "=== size ==="
            ls -lah "${BINARY}"
            echo "=== shared lib deps ==="
            readelf -d "${BINARY}" | grep NEEDED || echo "(none)"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-android-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/pumpkin
          if-no-files-found: warn

  # Smoke-test: verify the produced ELF files look correct
  verify-artifacts:
    runs-on: ubuntu-latest
    needs: build-android
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./android-builds
          pattern: pumpkin-android-*

      - name: Verify Android ELF binaries
        run: |
          find ./android-builds -type f | while read f; do
            echo "=== $f ==="
            file "$f" || true
            # Confirm it is an ELF for Android (should say "for Android")
            if file "$f" | grep -q "ELF"; then
              readelf -d "$f" 2>/dev/null | grep NEEDED || true
            else
              echo "WARNING: Not an ELF: $f"
            fi
          done
          - target: aarch64-linux-android
            api-level: 28
            arch: arm64-v8a
          - target: armv7-linux-androideabi
            api-level: 28
            arch: armeabi-v7a
          - target: x86_64-linux-android
            api-level: 28
            arch: x86_64
          - target: i686-linux-android
            api-level: 28
            arch: x86

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26c
          add-to-path: true
          link-to-sdk: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Cargo config for cross-compilation
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.aarch64-linux-android]
          linker = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
          ar = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

          [target.armv7-linux-androideabi]
          linker = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi28-clang"
          ar = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

          [target.x86_64-linux-android]
          linker = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android28-clang"
          ar = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

          [target.i686-linux-android]
          linker = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android28-clang"
          ar = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

          [build]
          rustflags = [
            "-C", "link-arg=-Wl,--no-rosegment",
            "-C", "link-arg=-Wl,--eh-frame-hdr",
            "-C", "link-arg=-Wl,-z,noexecstack",
            "-C", "link-arg=-Wl,-z,relro,-z,now",
            "-C", "link-arg=-landroid",
            "-C", "link-arg=-llog",
            "-C", "link-arg=-ldl",
          ]
          EOF
          cat .cargo/config.toml

      - name: Apply Android compatibility patches
        run: |
          chmod +x scripts/patch-android.sh
          ./scripts/patch-android.sh

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Build (Debug)
        run: |
          export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
          cargo build --target ${{ matrix.target }} --verbose
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
          PKG_CONFIG_PATH: ""
          CARGO_TARGET_${{ matrix.target | upper | replace('-', '_') }}_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.target == 'armv7-linux-androideabi' && 'armv7a-linux-androideabi28-clang' || format('{0}28-clang', matrix.target) }}

      - name: Build (Release)
        run: |
          export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
          cargo build --target ${{ matrix.target }} --release --verbose
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
          PKG_CONFIG_PATH: ""
          RUSTFLAGS: "-C target-feature=+neon -C opt-level=3 -C lto=fat -C codegen-units=1 -C panic=abort"

      - name: Strip binaries
        run: |
          export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
          STRIP_TOOL="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          if [ -f "target/${{ matrix.target }}/release/pumpkin" ]; then
            "${STRIP_TOOL}" "target/${{ matrix.target }}/release/pumpkin"
          fi
          if [ -f "target/${{ matrix.target }}/release/pumpkin-server" ]; then
            "${STRIP_TOOL}" "target/${{ matrix.target }}/release/pumpkin-server"
          fi

      - name: Test binary
        run: |
          file target/${{ matrix.target }}/release/pumpkin* || true
          ls -lah target/${{ matrix.target }}/release/pumpkin* || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-android-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/pumpkin*
            !target/${{ matrix.target }}/release/*.d
            !target/${{ matrix.target }}/release/*.rlib
          if-no-files-found: warn

  test-termux:
    runs-on: ubuntu-latest
    needs: build-android
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./android-builds
          pattern: pumpkin-android-*

      - name: Verify Android binaries
        run: |
          find ./android-builds -type f -executable -o -name "*.so" | while read f; do
            echo "Checking: $f"
            file "$f" || true
            readelf -d "$f" 2>/dev/null | grep NEEDED || true
          done
